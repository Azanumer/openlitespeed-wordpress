# ----------------------------------------------------------------------
# OpenLiteSpeed virtual host for WordPress (drop-in starting point)
#
# How to use:
#   1. WebAdmin Console > Virtual Hosts > Add, or paste into
#      /usr/local/lsws/conf/vhosts/<yourdomain>/vhconf.conf
#   2. Replace every EXAMPLE.COM with your domain.
#   3. Graceful restart:  /usr/local/lsws/bin/lswsctrl restart
#
# Tested on OpenLiteSpeed 1.7/1.8 + WordPress 6.x.
# ----------------------------------------------------------------------

docRoot                   $VH_ROOT/public_html/
vhDomain                  EXAMPLE.COM
vhAliases                 www.EXAMPLE.COM
adminEmails               admin@EXAMPLE.COM
enableGzip                1
enableIpGeo               1
enableKeepAlive           1
keepAliveTimeout          5

# --- logs -----------------------------------------------------------
errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                ERROR
}

accesslog $VH_ROOT/logs/access.log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b"
  logHeaders              7
  rollingSize             10M
  keepDays                30
  compressArchive         1
}

# --- rewrite (pretty permalinks, handled at vhost level so .htaccess
#     stays optional) ------------------------------------------------
rewrite {
  enable                  1
  autoLoadHtaccess        1   # keep 1 if WP plugins write .htaccess rules
}

# --- LiteSpeed Cache ------------------------------------------------
module cache {
  ls_enabled              1
  checkprivate            1   # do NOT cache logged-in / admin pages
  checkpublic             1
  maxcacheobjsz           10000000
  maxstaleage             200
  qscache                 1
  reqcookie               wp-postpass_*|wordpress_logged_in_*|comment_author_*
  respcookie              wp-postpass_*|wordpress_logged_in_*|comment_author_*
  ignorereqaborted        1
  expireinjson            0
}

# --- main site context ---------------------------------------------
context / {
  location                $VH_ROOT/public_html/
  allowBrowse             1
  note                    Wordpress site root

  rewrite {
    enable                1
    inherit               0
    rules                 <<<END_rules
      RewriteEngine On
      RewriteRule ^index\.php$ - [L]
      RewriteCond %{REQUEST_FILENAME} !-f
      RewriteCond %{REQUEST_FILENAME} !-d
      RewriteRule . /index.php [L]
    END_rules
  }

  # static assets: browser cache, no LSCache involved
  expires {
    enable                1
    expiresByType         image/*=A2592000, text/css=A2592000, application/javascript=A2592000, font/*=A2592000, application/pdf=A2592000
  }
}

# --- block sensitive files ------------------------------------------
context /wp-config.php {
  location                $VH_ROOT/public_html/wp-config.php
  allowBrowse             0
  note                    Never serve wp-config.php
}

context /.user.ini {
  location                $VH_ROOT/public_html/.user.ini
  allowBrowse             0
}

context /wp-content/debug.log {
  location                $VH_ROOT/public_html/wp-content/debug.log
  allowBrowse             0
}

# --- compression tuning ---------------------------------------------
# (Brotli is auto-negotiated by OLS when the client supports it.)
compressFileMaxSize       100M
compressFileMinSize       300
